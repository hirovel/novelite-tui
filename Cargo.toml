[package]
name = "novelite-tui"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "A modular terminal writing workspace"
license = "GPL-3.0-only"
repository = "https://github.com/hirovel/novelite-tui"

[dependencies]
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tempfile = "3"
unicode-width = "0.2"
unicode-segmentation = "=1.13.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"
time = { version = "=0.3.55", default-features = false, features = ["std"] }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
encoding_rs = "=0.8.35"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
